apiVersion: v2
name: alloy
description: Grafana Alloy collector (metrics remote_write + logs to Loki) wired to Grafana Cloud with sealed-secrets credentials. Unified replacement for the prometheus + promtail charts.
type: application
version: 1.1.3
appVersion: "1.17.0"
home: https://grafana.com/oss/alloy/
sources:
  - https://github.com/grafana/alloy
  - https://grafana.com/docs/alloy/latest/

dependencies:
  - name: sealed-secret
    version: 1.0.*
    repository: https://moreirodamian.github.io/helm-charts/
  - name: alloy
    version: 1.10.0
    repository: https://grafana.github.io/helm-charts
  - name: kube-state-metrics
    version: 7.8.1
    repository: https://prometheus-community.github.io/helm-charts
