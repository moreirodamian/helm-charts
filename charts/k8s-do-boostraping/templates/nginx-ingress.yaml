{{ if .Values.apps.ingress.enabled }}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-{{ .Values.apps.suffix }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  {{ if .Values.apps.project }}
  project: {{ .Values.apps.project }}
  {{ else }}
  project: infra-{{ .Values.apps.suffix }}
  {{ end }}
  source:
    repoURL: 'https://moreirodamian.github.io/helm-charts/'
    targetRevision: 5.0.6
    chart: ingress-nginx
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: ingress-nginx.controller.kind
          value: {{ .Values.ingress.controllerKind | default "DaemonSet" }}
        {{- if .Values.ingress.disablePublicNodePort }}
        - name: ingress-nginx.controller.service.annotations.kubernetes\.digitalocean\.com/firewall-managed
          value: "false"
        {{- end }}
        - name: ingress-nginx.controller.service.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-type
          value: "REGIONAL"
        - name: ingress-nginx.controller.service.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-name
          value: {{ .Values.ingress.loadbalancerName }}
        - name: ingress-nginx.controller.service.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-hostname
          value: {{ .Values.ingress.loadbalancerName }}
        {{- if .Values.ingress.healthcheck.useNginx | default false }}
        - name: ingress-nginx.controller.service.externalTrafficPolicy
          value: "Local"
        - name: ingress-nginx.controller.service.nodePorts.http
          value: "{{ .Values.ingress.nodePort | default "30080" }}"
        - name: ingress-nginx.controller.service.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-healthcheck-protocol
          value: "http"
        - name: ingress-nginx.controller.service.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-healthcheck-port
          value: "{{ .Values.ingress.nodePort | default "30080" }}"
        - name: ingress-nginx.controller.service.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-healthcheck-path
          value: "/healthz"
        {{- end }}
      {{ if .Values.ingress.doProxyProtocol.enabled }}
        - name: ingress-nginx.controller.service.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-enable-proxy-protocol
          value: "true"
      {{ end }}
      {{- if .Values.ingress.internalLoadBalancer.enabled }}
        - name: ingress-nginx.controller.service.internal.enabled
          value: "true"
        - name: ingress-nginx.controller.service.internal.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-network
          value: "INTERNAL"
        - name: ingress-nginx.controller.service.internal.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-type
          value: "REGIONAL"
        - name: ingress-nginx.controller.service.internal.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-name
          value: {{ .Values.ingress.internalLoadBalancer.name | default (printf "%s-internal" .Values.ingress.loadbalancerName) }}
        {{- if .Values.ingress.doProxyProtocol.enabled }}
        - name: ingress-nginx.controller.service.internal.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-enable-proxy-protocol
          value: "true"
        {{- end }}
      {{- end }}
      {{- range $i, $cidr := .Values.ingress.loadBalancerSourceRanges }}
        - name: ingress-nginx.controller.service.loadBalancerSourceRanges[{{ $i }}]
          value: "{{ $cidr }}"
      {{- end }}
      {{- with .Values.ingress.resources }}
        {{- with .requests }}
        {{- if .cpu }}
        - name: ingress-nginx.controller.resources.requests.cpu
          value: "{{ .cpu }}"
        {{- end }}
        {{- if .memory }}
        - name: ingress-nginx.controller.resources.requests.memory
          value: "{{ .memory }}"
        {{- end }}
        {{- end }}
        {{- with .limits }}
        {{- if .cpu }}
        - name: ingress-nginx.controller.resources.limits.cpu
          value: "{{ .cpu }}"
        {{- end }}
        {{- if .memory }}
        - name: ingress-nginx.controller.resources.limits.memory
          value: "{{ .memory }}"
        {{- end }}
        {{- end }}
      {{- end }}
      {{- range $port, $service := .Values.ingress.tcp }}
        - name: ingress-nginx.tcp.{{ $port }}
          value: "{{ $service }}"
      {{- end }}
      {{- range $port, $service := .Values.ingress.udp }}
        - name: ingress-nginx.udp.{{ $port }}
          value: "{{ $service }}"
      {{- end }}
  destination:
    namespace: nginx-ingress
    name: {{ .Values.apps.destination.name }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
{{ end }}