{{- if and .Values.apps.promtail.enabled .Values.promtail.url }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail-{{ .Values.apps.suffix }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  {{ if .Values.apps.project }}
  project: {{ .Values.apps.project }}
  {{ else }}
  project: infra-{{ .Values.apps.suffix }}
  {{ end }}
  source:
    repoURL: 'https://moreirodamian.github.io/helm-charts/'
    targetRevision: 6.17.3
    chart: promtail
    helm:
      parameters:
        # Host-only push URL via env (expanded by -config.expand-env).
        - name: "promtail.extraEnv[0].name"
          value: "LOKI_URL"
        - name: "promtail.extraEnv[0].value"
          value: {{ .Values.promtail.url }}
        # Loki credentials from the sealed Secret.
        - name: "promtail.extraEnvFrom[0].secretRef.name"
          value: {{ .Values.promtail.secret.name }}
        - name: "sealed-secret.name"
          value: {{ .Values.promtail.secret.name }}
        {{- if .Values.promtail.secret.username }}
        - name: "sealed-secret.encryptedData.LOKI_USER"
          value: {{ .Values.promtail.secret.username }}
        {{- end }}
        {{- if .Values.promtail.secret.password }}
        - name: "sealed-secret.encryptedData.LOKI_PASS"
          value: {{ .Values.promtail.secret.password }}
        {{- end }}
  destination:
    namespace: monitoring
    name: {{ .Values.apps.destination.name }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
{{- end }}
