spec:
  destination:
  source:
    targetRevision: HEAD
ingress:
  loadbalancerName: do-loadbalancer.com
  # Controller kind: DaemonSet or Deployment
  controllerKind: DaemonSet
  # Fixed NodePort for HTTP (used when healthcheck.useNginx is true)
  nodePort: "30080"
  healthcheck:
    # true: LB healthchecks directly against nginx-ingress on a pinned NodePort (validates ingress is alive)
    # false: LB uses DO CCM auto-config (kube-proxy port 10256, validates node is alive)
    useNginx: false
  doProxyProtocol:
    enabled: false
  # DO LoadBalancer firewall allow-rules (comma-separated "{type}:{source}", e.g. "cidr:1.2.0.0/16,ip:1.2.3.4").
  # Empty string = no firewall (LB open). Current value locks the LB to Cloudflare ranges
  # (refresh from https://www.cloudflare.com/ips-v4; Cloudflare announces changes, rarely).
  loadBalancerAllowRules: "cidr:173.245.48.0/20,cidr:103.21.244.0/22,cidr:103.22.200.0/22,cidr:103.31.4.0/22,cidr:141.101.64.0/18,cidr:108.162.192.0/18,cidr:190.93.240.0/20,cidr:188.114.96.0/20,cidr:197.234.240.0/22,cidr:198.41.128.0/17,cidr:162.158.0.0/15,cidr:104.16.0.0/13,cidr:104.24.0.0/14,cidr:172.64.0.0/13,cidr:131.0.72.0/22"
  tcp: {}
  udp: {}
prometheus:
  remoteWrite:
    url: ~
    secret:
      name: prom-secret
      username: ~
      password: ~
  clusterName: ~
promtail:
  # Host-only Loki push URL (no credentials in the URL).
  url: ~
  # Loki credentials are sealed; the controller materialises them into this
  # Secret (keys LOKI_USER / LOKI_PASS). Inject the AgB... blobs below.
  secret:
    name: loki-grafana-cloud
    username: ~
    password: ~
# Grafana Alloy: unified metrics remote_write + logs collector.
# Mutually exclusive with prometheus + promtail (see the guard in
# templates/validate.yaml). All credentials are sealed-secrets.
alloy:
  clusterName: ~
  # Secret (and SealedSecret) name holding the 4 Grafana Cloud credentials.
  secret:
    name: alloy-grafana-cloud
  remoteWrite:
    # Grafana Cloud Prometheus remote_write URL.
    url: ~
    secret:
      username: ~
      password: ~
  loki:
    # Grafana Cloud Loki push URL.
    url: ~
    secret:
      username: ~
      password: ~
apps:
  suffix: dev
  destination:
    name: test-cluster-name
  ingress:
    enabled: true
  certManager:
    enabled: true
    digitalocean:
      dns: false
      token: ~
    cloudflare:
      dns: false
      token: ~
    zerossl:
      enabled: false
      eabKeyId: ~
      eabHmacKeyEncrypted: ~
  prometheus:
    enabled: true
  promtail:
    enabled: true
  # Alloy replaces prometheus + promtail. Do NOT enable alongside them.
  alloy:
    enabled: false
  rollout:
    enabled: true
  sealedSecrets:
    enabled: false
  metricsServer:
    version: 3.13.0

# HTML index page is now generated on the GitHub Pages landing page
