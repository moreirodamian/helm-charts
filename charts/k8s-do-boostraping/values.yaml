spec:
  destination:
  source:
    targetRevision: HEAD
ingress:
  loadbalancerName: do-loadbalancer.com
  # Controller kind: DaemonSet or Deployment
  controllerKind: DaemonSet
  # Fixed NodePort for HTTP (used when healthcheck.useNginx is true)
  nodePort: "30080"
  healthcheck:
    # true: LB healthchecks directly against nginx-ingress on a pinned NodePort (validates ingress is alive)
    # false: LB uses DO CCM auto-config (kube-proxy port 10256, validates node is alive)
    useNginx: false
  doProxyProtocol:
    enabled: false
  # Second DO LoadBalancer with a private VPC IP only (no public IP), serving the
  # same ingress-nginx pods. Use it to reach the ingress from inside the VPC
  # (e.g. NetBird routing peers) — the public LB firewall rejects private CIDRs.
  # Inherits doProxyProtocol so nginx behaves the same on both.
  internalLoadBalancer:
    enabled: false
    # DO LB name; defaults to "<loadbalancerName>-internal"
    name: ""
  # Additional internal LBs (one private IP each) for separate access planes.
  # Passed through to the ingress-nginx wrapper chart (>= 5.1.0).
  #   extraInternalLoadBalancers:
  #     clients:
  #       loadbalancerName: my-cluster-internal-clients
  #       proxyProtocol: true
  extraInternalLoadBalancers: {}
  # Disable the DOKS-managed public-access firewall rule for the LB NodePort
  # (annotation kubernetes.digitalocean.com/firewall-managed=false). Closes the node-IP+NodePort
  # bypass: traffic can only reach the cluster via the LB (which uses the VPC private network).
  disablePublicNodePort: true
  # DO LoadBalancer source-range allowlist (native spec.loadBalancerSourceRanges — DO's preferred method;
  # the do-loadbalancer-allow-rules annotation is ignored when this is set). List of CIDRs.
  # Empty list = no firewall (LB open). Current list locks the LB to Cloudflare ranges
  # (refresh from https://www.cloudflare.com/ips-v4; Cloudflare announces changes, rarely).
  loadBalancerSourceRanges:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
  # Optional nginx controller resource overrides (requests/limits with cpu/memory).
  resources: {}
  tcp: {}
  udp: {}
prometheus:
  remoteWrite:
    url: ~
    secret:
      name: prom-secret
      username: ~
      password: ~
  clusterName: ~
promtail:
  # Host-only Loki push URL (no credentials in the URL).
  url: ~
  # Loki credentials are sealed; the controller materialises them into this
  # Secret (keys LOKI_USER / LOKI_PASS). Inject the AgB... blobs below.
  secret:
    name: loki-grafana-cloud
    username: ~
    password: ~
# Grafana Alloy: unified metrics remote_write + logs collector.
# Mutually exclusive with prometheus + promtail (see the guard in
# templates/validate.yaml). All credentials are sealed-secrets.
alloy:
  # Version of the wrapper alloy chart to deploy (Application targetRevision).
  chartVersion: ~
  clusterName: ~
  # Secret (and SealedSecret) name holding the 4 Grafana Cloud credentials.
  secret:
    name: alloy-grafana-cloud
  remoteWrite:
    # Grafana Cloud Prometheus remote_write URL.
    url: ~
    secret:
      username: ~
      password: ~
  loki:
    # Grafana Cloud Loki push URL.
    url: ~
    secret:
      username: ~
      password: ~
apps:
  suffix: dev
  destination:
    name: test-cluster-name
  ingress:
    enabled: true
  certManager:
    enabled: true
    digitalocean:
      dns: false
      token: ~
    cloudflare:
      dns: false
      token: ~
    zerossl:
      enabled: false
      eabKeyId: ~
      eabHmacKeyEncrypted: ~
  prometheus:
    enabled: true
  promtail:
    enabled: true
  # Alloy replaces prometheus + promtail. Do NOT enable alongside them.
  alloy:
    enabled: false
  rollout:
    enabled: true
  sealedSecrets:
    enabled: false
  metricsServer:
    version: 3.13.0

# HTML index page is now generated on the GitHub Pages landing page
