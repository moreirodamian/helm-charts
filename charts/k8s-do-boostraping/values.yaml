spec:
  destination:
  source:
    targetRevision: HEAD
ingress:
  loadbalancerName: do-loadbalancer.com
  # Controller kind: DaemonSet or Deployment
  controllerKind: DaemonSet
  # Fixed NodePort for HTTP (used when healthcheck.useNginx is true)
  nodePort: "30080"
  healthcheck:
    # true: LB healthchecks directly against nginx-ingress on a pinned NodePort (validates ingress is alive)
    # false: LB uses DO CCM auto-config (kube-proxy port 10256, validates node is alive)
    useNginx: false
  doProxyProtocol:
    enabled: false
  tcp: {}
  udp: {}
prometheus:
  remoteWrite:
    url: ~
    secret:
      name: prom-secret
      username: ~
      password: ~
  clusterName: ~
promtail:
  url: ~
apps:
  suffix: dev
  destination:
    name: test-cluster-name
  ingress:
    enabled: true
  certManager:
    enabled: true
    digitalocean:
      dns: false
      token: ~
    cloudflare:
      dns: false
      token: ~
    zerossl:
      enabled: false
      eabKeyId: ~
      eabHmacKeyEncrypted: ~
  prometheus:
    enabled: true
  promtail:
    enabled: true
  rollout:
    enabled: true
  sealedSecrets:
    enabled: false
  metricsServer:
    version: 3.13.0

# HTML index page is now generated on the GitHub Pages landing page
